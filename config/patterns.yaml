# Wspólna biblioteka nazwanych wzorców wartości. Użycie w regexach configu: {{@nazwa}}.
# Wzorce muszą być poprawnymi regexami Pythona (bez grup przechwytujących — używać (?:...)).
krs:    '(?<!\d)\d{10}(?!\d)'
nip:    '(?<!\d)(?:\d{3}-?\d{3}-?\d{2}-?\d{2}|\d{3}-?\d{2}-?\d{2}-?\d{3})(?!\d)'
regon:  '(?<!\d)\d{9}(?:\d{5})?(?!\d)'
pesel:  '(?<!\d)\d{11}(?!\d)'
iban:   '(?<![\dA-Z])(?:PL\s?)?\d{2}(?:\s?\d{4}){6}(?!\d)'
amount: '(?<![\d.,])\d{1,3}(?:[  .]?\d{3})*,\d{2}(?!\d)'
# daty: DD.MM.RRRR (też - /), RRRR-MM-DD (też . /), „DD MM RRRR” (wydruki bankowe), D miesiąca RRRR
date:   '(?<!\d)(?:\d{1,2}\s?[.\-/]\s?\d{1,2}\s?[.\-/]\s?\d{4}|\d{4}[.\-/]\d{1,2}[.\-/]\d{1,2}(?!\d)|\d{1,2}\s\d{2}\s\d{4}(?!\d)|\d{1,2}\s+(?:stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia)\s+\d{4})'
bzp:    '\d{4}/BZP\s?\d{8}(?:/\d{2})?'
ted:    '(?<!\d)(?:\d{6}-\d{4}|\d{4}/S\s?\d{3}-\d{6})(?!\d)'
email:  '[\w.+\-]+@[\w\-]+(?:\.[\w\-]+)+'
# e-mail z tolerancją OCR: '@' bywa czytane jako Q, ©, g, e, (, (), (a, ®  → odtwarzane normalizatorem `email`
email_ocr: '[\w.+\-]+(?:@|\(a\)|\(\)|\(a|[Q©®(])[\w\-]+(?:\.[\w\-]+)*\.[A-Za-z]{2,10}\b'
